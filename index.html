<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Theory</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id = "outer">
        <div id = "header">
            <h1>Music Theory</h1>
            <span id = "kicker">PRACTICE</span>
            <button id = "full_screen" title="Toggle fullscreen">&#9974;</button>
        </div>
        <div id = "midi_status">Checking for MIDI access&hellip;</div>
        <div id = "app_grid">
            <div id = "left_column">
                <div id = "instructions">
                    <div>&rarr; Select a topic below</div>
                    <div>&rarr; Play the shown notes</div>
                    <div>&rarr; Keys light green when correct</div>
                </div>
                <div id = "game_choices">
                    <div class="menu_panel">
                        <div class="menu_panel_header">Base Notes</div>
                        <div class="menu_panel_body" id = "menu_base_notes"></div>
                    </div>
                    <div class="menu_panel">
                        <div class="menu_panel_header">Intervals</div>
                        <div class="menu_panel_body" id = "menu_intervals"></div>
                    </div>
                    <div class="menu_panel">
                        <div class="menu_panel_header">Chords &amp; Scales</div>
                        <div class="menu_panel_body" id = "menu_chords_scales"></div>
                    </div>
                    <div class="menu_panel">
                        <div class="menu_panel_header">Timing</div>
                        <div class="menu_panel_body" id = "menu_rhythm"></div>
                    </div>
                </div>
                <button id = "options_toggle">&#9881; MORE OPTIONS</button>
            </div>
            <div id = "right_column">
                <div id = choices style="display: none">
                    <div class="choice_holder">
                        <div class="selection_title">base notes of chords, intervals, and scales</div>
                        <div id = "note_types" class="selection"></div>
                    </div>
                    <div class="choice_holder">
                        <div class="selection_title">intervals</div>
                        <div id = "interval_types" class="selection"></div>
                    </div>
                    <div class="choice_holder">
                        <div class="selection_title">chords</div>
                        <div id = "chord_types" class="selection"></div>
                    </div>
                    <div class="choice_holder">
                        <div class="selection_title">scales and modes</div>
                        <div id = "scale_types" class="selection"></div>
                    </div>
                    <div class="choice_holder">
                        <div class="selection_title">sound</div>
                        <div class="selection sound_settings">
                            <label>
                                <span class="control_label">Waveform</span>
                                <select id = "synth_waveform">
                                    <option value="sine" selected>Sine</option>
                                    <option value="triangle">Triangle</option>
                                    <option value="sawtooth">Sawtooth</option>
                                    <option value="square">Square</option>
                                </select>
                            </label>
                            <label>
                                <span class="control_label">Detune</span>
                                <input type="range" id = "synth_detune" min="0" max="30" step="1" value="6">
                                <span class="value_readout" id = "synth_detune_value">6&cent;</span>
                            </label>
                            <label>
                                <span class="control_label">Attack</span>
                                <input type="range" id = "synth_attack" min="0" max="200" step="5" value="20">
                                <span class="value_readout" id = "synth_attack_value">20ms</span>
                            </label>
                            <label>
                                <span class="control_label">Release</span>
                                <input type="range" id = "synth_release" min="10" max="400" step="10" value="80">
                                <span class="value_readout" id = "synth_release_value">80ms</span>
                            </label>
                            <label>
                                <span class="control_label">Volume</span>
                                <input type="range" id = "synth_volume" min="0" max="50" step="1" value="16">
                                <span class="value_readout" id = "synth_volume_value">16%</span>
                            </label>
                            <label>
                                <span class="control_label">Note length</span>
                                <input type="range" id = "synth_duration" min="0.1" max="2" step="0.1" value="1.0">
                                <span class="value_readout" id = "synth_duration_value">1.0s</span>
                            </label>
                            <label>
                                <span class="control_label">Gap</span>
                                <input type="range" id = "synth_gap" min="0.1" max="2" step="0.1" value="0.5">
                                <span class="value_readout" id = "synth_gap_value">0.5s</span>
                            </label>
                            <div class="sound_preview_buttons">
                                <button id = "synth_preview_note">&#9658; note</button>
                                <button id = "synth_preview_interval">&#9658; interval</button>
                            </div>
                        </div>
                    </div>
                </div>
                <button id = "notation_toggle" title="Toggle musical notation">&#9834; Notation</button>
                <pre id = "terminal">Select a topic to begin.</pre>
                <div id = "notation" style="display: none"></div>
                <div id = "rhythm_panel" style="display: none">
                    <div id = "rhythm_controls">
                        <button id = "rhythm_start">&#9658; START</button>
                        <label>
                            <span class="control_label">Tempo</span>
                            <input type="range" id = "rhythm_tempo" min="40" max="160" step="5" value="80">
                            <span class="value_readout" id = "rhythm_tempo_value">80 bpm</span>
                        </label>
                        <label>
                            <span class="control_label">Rhythms</span>
                            <select id = "rhythm_source">
                                <option value="generated" selected>Generated</option>
                                <option value="bach">Bach chorales</option>
                            </select>
                        </label>
                        <label>
                            <span class="control_label">Measures</span>
                            <select id = "rhythm_measures">
                                <option value="2">2</option>
                                <option value="4" selected>4</option>
                                <option value="8">8</option>
                                <option value="12">12</option>
                                <option value="16">16</option>
                            </select>
                        </label>
                        <label>
                            <span class="control_label">Notes</span>
                            <select id = "rhythm_vocabulary">
                                <option value="quarters">Quarters</option>
                                <option value="eighths" selected>Eighths</option>
                                <option value="sixteenths">Sixteenths</option>
                            </select>
                        </label>
                        <label class="checkbox_label">
                            <input type="checkbox" id = "rhythm_rests" checked>
                            <span class="control_label">Rests</span>
                        </label>
                        <label class="checkbox_label">
                            <input type="checkbox" id = "rhythm_melody">
                            <span class="control_label">Pitches</span>
                        </label>
                        <label class="checkbox_label">
                            <input type="checkbox" id = "rhythm_metronome" checked>
                            <span class="control_label">Metronome</span>
                        </label>
                    </div>
                    <div id = "rhythm_source_label"></div>
                    <div id = "rhythm_stage">
                        <div id = "rhythm_score"></div>
                        <div id = "rhythm_overlay">
                            <div id = "rhythm_playhead" style="display: none"></div>
                        </div>
                    </div>
                    <div id = "rhythm_feedback"></div>
                </div>
                <canvas id	= "visuals" style="display: none"></canvas>
                <div id = "keyboard">
                    <div id = "black_keys">
                        <div id = "1"   class= "black" style="left: 10.04%;"></div>
                        <div id = "3"   class= "black" style="left: 24.32%;"></div>
                        <div id = "6"   class= "black" style="left: 52.89%;"></div>
                        <div id = "8"   class= "black" style="left: 67.18%;"></div>
                        <div id = "10"  class= "black" style="left: 81.46%;"></div>
                    </div>
                    <div id = "white_keys">
                        <div id = "0"   class= "white"><span class="key_label">C</span></div>
                        <div id = "2"   class= "white"><span class="key_label">D</span></div>
                        <div id = "4"   class= "white"><span class="key_label">E</span></div>
                        <div id = "5"   class= "white"><span class="key_label">F</span></div>
                        <div id = "7"   class= "white"><span class="key_label">G</span></div>
                        <div id = "9"   class= "white"><span class="key_label">A</span></div>
                        <div id = "11"  class= "white"><span class="key_label">B</span></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src = "utility.js"      ></script>
    <script src = "canvas.js"       ></script>
    <script src = "draw.js"         ></script>
    <script src = "midi.js"         ></script>
    <script src = "keyboard_input.js"></script>
    <script src = "audio.js"        ></script>
    <script src = "synth_controls.js"></script>
    <script src = "terminal.js"     ></script>
    <script src = "theory.js"       ></script>
    <script src = "quiz_helpers.js" ></script>
    <script src = "https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"></script>
    <script src = "notation.js"     ></script>
    <script src = "note_quiz.js"    ></script>
    <script src = "interval_quiz.js"></script>
    <script src = "chord_quiz.js"   ></script>
    <script src = "scale_quiz.js"   ></script>
    <script src = "scale_degrees.js"></script>
    <script src = "bach_corpus.js"  ></script>
    <script src = "rhythm.js"       ></script>
    <script src = "buttons.js"      ></script>
    <script src = "interval_ear_training.js"></script>

</body>

</html>
